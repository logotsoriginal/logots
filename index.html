<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGOTS SITE - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #080b11;
            background-image: 
                radial-gradient(at 0% 0%, hsla(242,61%,15%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(341,83%,12%,1) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Top Bar */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 100px;
            max-width: fit-content;
            margin: 0 auto 40px auto;
            backdrop-filter: blur(10px);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88;
            animation: pulse 1.8s infinite;
        }

        .status-text {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a0aec0;
            font-weight: 600;
        }

        /* Main Content Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
        }

        /* Brand Logo/Text Styling */
        .brand-box {
            margin-bottom: 35px;
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-tag {
            font-size: 0.85rem;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 8px;
            font-weight: 700;
        }

        /* Premium Glass Card */
        .hero-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            margin-bottom: 30px;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }

        .main-status {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .desc-text {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .highlight-text {
            color: #f59e0b;
            font-weight: 600;
            margin-top: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Ultra Modern Telegram Button */
        .action-wrapper {
            width: 100%;
        }

        .tg-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #229ED9;
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 12px 24px rgba(34, 158, 217, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tg-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.2);
        }

        .tg-icon {
            width: 22px;
            height: 22px;
            fill: white;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 40px;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <!-- Top Badge Info -->
    <div class="status-bar">
        <div class="pulse-dot"></div>
        <span class="status-text">Server Active & Deploying</span>
    </div>

    <main class="main-container">
        <!-- Logo / Brand Section -->
        <div class="brand-box">
            <h1 class="brand-title">LOGOTS</h1>
            <div class="brand-tag">Tatkal Extension</div>
        </div>

        <!-- Glassmorphism Announcement Box -->
        <div class="hero-card">
            <h2 class="main-status">COMING SOON</h2>
            <p class="desc-text">The next-generation, ultra-fast automation tool for high-speed ticket booking is currently compiling.</p>
            <div class="highlight-text">
                ⚡ Downloading link will be unlocked here shortly.
            </div>
        </div>

        <!-- Telegram Action -->
        <div class="action-wrapper">
            <a href="https://t.me/logotstatkal" class="tg-btn" target="_blank">
                <!-- SVG Telegram Icon for premium look -->
                <svg class="tg-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-0.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-0.08-.06-.19-.04-.27-.02-.12.02-1.96 1.24-5.54 3.65-.52.36-0.99.54-1.41.53-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.24.36-.49.99-.75 3.88-1.69 6.46-2.8 7.74-3.32 3.69-1.5 4.45-1.76 4.95-1.77.11 0 .36.03.52.16.13.1.17.24.19.34.02.07.02.21.01.29z"/>
                </svg>
                Join Official Telegram Channel
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LOGOTS Software. Engineered for speed.</p>
    </footer>

</body>
</html>
